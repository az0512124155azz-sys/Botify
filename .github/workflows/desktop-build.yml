name: Desktop shell packaging
on: workflow_dispatch
jobs:
  package:
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: mac
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run build:${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: bothub-${{ matrix.platform }}-shell
          path: desktop/dist/
          if-no-files-found: error
