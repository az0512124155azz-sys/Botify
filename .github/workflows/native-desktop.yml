name: Native desktop compilation
on:
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build native self-contained Windows EXE
        run: dotnet publish native/windows/BotHub.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o dist/windows
      - uses: actions/upload-artifact@v4
        with:
          name: BotHub-native-windows-incomplete
          path: dist/windows/
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile SwiftUI app
        run: |
          mkdir -p dist/BotHub.app/Contents/MacOS
          mkdir -p dist/BotHub.app/Contents/Resources
          swiftc native/macos/BotHub.swift -o dist/BotHub.app/Contents/MacOS/BotHub -framework SwiftUI
          printf 'APPL????' > dist/BotHub.app/Contents/PkgInfo
          cat > dist/BotHub.app/Contents/Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleExecutable</key><string>BotHub</string>
            <key>CFBundleIdentifier</key><string>com.botify.bothub.macos</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleName</key><string>BotHub</string>
            <key>CFBundleVersion</key><string>1</string>
            <key>CFBundleShortVersionString</key><string>0.3.0</string>
            <key>LSMinimumSystemVersion</key><string>13.0</string>
          </dict></plist>
          PLIST
          plutil -lint dist/BotHub.app/Contents/Info.plist
      - name: Package unsigned DMG
        run: hdiutil create -volname BotHub -srcfolder dist/BotHub.app -ov -format UDZO dist/BotHub-unsigned.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: BotHub-native-macos-incomplete
          path: dist/BotHub-unsigned.dmg
